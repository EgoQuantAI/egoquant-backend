# EgoQuant risk questionnaire: scoring configuration.
#
# PROVISIONAL: every cutoff, cap and table in this file is a team proposal for the
# FinTechathon demo. None of it is a bank's approved suitability policy. The scoring code
# reads all numbers from here; nothing is hard-coded in scoring.py.
# Justifications for each number: egoquant/risk_profile/README.md.

questionnaire_version: eq-rq-0.1.0   # must match questions.json

# --------------------------------------------------------------------------
# Section GL: Grable & Lytton (1999) score bands, as published on the Rutgers scoring grid.
# (The bands are published; mapping them to levels 1-5 is ours.)
# --------------------------------------------------------------------------
tolerance:
  bands:                              # inclusive ranges, must cover 13-47 with no gaps
    - {min: 13, max: 18, level: 1, label: low}
    - {min: 19, max: 22, level: 2, label: below average}
    - {min: 23, max: 28, level: 3, label: average}
    - {min: 29, max: 32, level: 4, label: above average}
    - {min: 33, max: 47, level: 5, label: high}

  # PROVISIONAL consistency check (flag only; never changes a score).
  # Compares the self-description item with the mean of the scenario items, each rescaled to 0-1
  # because the items have 2, 3 or 4 options.
  consistency:
    self_item: GL1
    # GL9/GL10 are the gain-framed / loss-framed pair: excluded, differences there are normal loss aversion.
    # GL5 (comfort/experience) and GL6 (word association) are excluded: they are not scenarios.
    scenario_items: [GL2, GL3, GL4, GL7, GL8, GL11, GL12, GL13]
    excluded_items: [GL5, GL6, GL9, GL10]
    threshold: 0.5                    # |self - mean(scenarios)| >= threshold -> "review_suggested"

# --------------------------------------------------------------------------
# Section B: risk capacity. The answers are AVERAGED like the risk-attitude items are summed, so one weaker answer
# (for example an irregular income) is outweighed by strong ones (a long horizon, savings, a small share of wealth).
#   * B2 horizon, B4 savings, B5 share of wealth, B6 income give POINTS (1-5); the AVERAGE decides a level.
#   * B3 (money needed back by the goal date) is a HARD cap and is never averaged away: it states in money how much of
#     the amount the plan can lose, so a plan that needs the money back cannot be offered a risky portfolio because
#     other answers are good. To average it too (or to make another question a hard cap), move it between the lists.
#   capacity_level = min(hard caps, level of the average)
# --------------------------------------------------------------------------
capacity:
  question_order: [B2, B3, B4, B5, B6]   # tie-break for the limiting question: first in this order
  hard_caps: [B3]
  option_caps: {}                        # option -> level, for hard-capped questions other than B3
  # An answer that limits the capacity on its own although the question is averaged (option -> level). A horizon under a year
  # or under three years is not made safe by big savings (twelve-user check, 20 Oct): the old caps for the two shortest answers.
  # Empty = pure averaging. The other options of the question still count as points in the average.
  answer_caps:
    B2: {lt1: 2, y1_3: 3}
  aggregate:
    questions: [B2, B4, B5, B6]
    option_points:
      B2: {lt1: 1, y1_3: 3, y3_5: 4, gt5: 5}            # horizon
      B4: {lt3: 2, m3_6: 4, gt6: 5}                      # months of expenses saved outside
      B5: {gt75: 1, p50_75: 3, p25_50: 4, lt25: 5}       # share of total wealth invested
      B6: {none: 3, unstable: 4, stable: 5}              # income
    level_bands:                          # average points -> level; lower bound inclusive (the average is rounded to the nearest level)
      - {below: 1.5, level: 1}
      - {below: 2.5, level: 2}
      - {below: 3.5, level: 3}
      - {below: 4.5, level: 4}
    max_level: 5
  # B3: loss_capacity = max(0, invested - needed) / invested. Lower bound inclusive:
  # cap = level of the first band whose `below` is greater than loss_capacity; else max_cap.
  # ESTIMATE to be confirmed by Agent A stress tests (bands track each level's severe-crash loss).
  loss_capacity_bands:
    - {below: 0.05, cap: 1}
    - {below: 0.10, cap: 2}
    - {below: 0.20, cap: 3}
    - {below: 0.35, cap: 4}
  loss_capacity_max_cap: 5
  explain_phrases:                    # used by explain.py
    B2: your investment horizon
    B3: the amount you need back by your goal date
    B4: your emergency savings
    B5: the share of your wealth in this investment
    B6: your income

# --------------------------------------------------------------------------
# Section K: knowledge and experience. NEVER changes the C-level; only restricts complex products.
# --------------------------------------------------------------------------
knowledge:
  big_three: [K1, K2, K3]
  full_access_min_score: 3            # and some experience (if full_access_requires_experience)
  full_access_requires_experience: true
  warning_min_score: 2                # below this -> blocked_complex
  # "Some experience" = at least one of these products in K4, OR K5 not in no_experience_years.
  experience_products: [bonds, stocks, derivatives, crypto]
  no_experience_years: [none]
  # Agent C ProductType values blocked when product_access = blocked_complex.
  # Leveraged/inverse products are not in Agent C's catalog yet; add them here when they are.
  complex_product_types: [crypto_etp, crypto_spot]

# --------------------------------------------------------------------------
# Section D: gate
# --------------------------------------------------------------------------
gate:
  question: D1
  no_loss_option: "no"                # this answer -> C1, lowest category, R1 only
  max_stress_loss: 0.0                # PROVISIONAL: suitability stress-loss limit under the gate

# --------------------------------------------------------------------------
# C-level table. PROVISIONAL.
#   max_r_level: highest product risk level allowed (regulatory matching C_n <-> R_n)
#   max_equity:  suitability equity cap passed to Agent A as a Constraint
#   max_commodity: cap on gold and other commodities (R3 gold from C3, R4 silver/commodities from C4)
#   max_crypto:  cap on crypto-assets (R5, so C5 only, and only with full product knowledge)
#   illustrative_crash_loss: rough severe-crash loss of a portfolio at the equity cap. ILLUSTRATIVE,
#     used only for explanation text and the B3 band design; to be replaced by Agent A stress results.
# OPEN DECISION: C2 equity cap is 0%; we may later allow an R2 bond-heavy mixed fund.
# Agent A copies max_equity, max_commodity, max_crypto and illustrative_crash_loss (its class loss cap)
# into DEFAULT_RISK_CLASS_POLICIES; a test keeps the two tables in sync.
# --------------------------------------------------------------------------
c_levels:
  C1: {max_r_level: 1, max_equity: 0.00, max_commodity: 0.00, max_crypto: 0.00, illustrative_crash_loss: 0.05}
  C2: {max_r_level: 2, max_equity: 0.00, max_commodity: 0.00, max_crypto: 0.00, illustrative_crash_loss: 0.10}
  C3: {max_r_level: 3, max_equity: 0.40, max_commodity: 0.10, max_crypto: 0.00, illustrative_crash_loss: 0.20}
  C4: {max_r_level: 4, max_equity: 0.70, max_commodity: 0.15, max_crypto: 0.00, illustrative_crash_loss: 0.35}
  C5: {max_r_level: 5, max_equity: 0.90, max_commodity: 0.20, max_crypto: 0.05, illustrative_crash_loss: 0.45}

# --------------------------------------------------------------------------
# Adapter -> Agent A Constraints
# --------------------------------------------------------------------------
adapter:
  # Constraint requires a named scenario for max_stress_loss. Must match AgentConfig.capacity_scenario.
  stress_scenario: equity_down_30_bond_down_5
  # PROVISIONAL: per-asset cap sent to Agent A for R1-only investors (C1). Agent C's catalog has only two
  # R1 funds (BIL, SHY), so Agent A's default 40% cap makes every C1 portfolio infeasible. T-bill and
  # short-Treasury funds carry little concentration risk, so the cap is lifted for this case only.
  r1_max_asset_weight: 1.0

# --------------------------------------------------------------------------
# Compliance record. PROVISIONAL.
#   validity_months: how long a completed assessment stays valid. Suitability rules expect investors to be
#   re-assessed periodically; 12 months is a common re-assessment cycle. An expired profile is FLAGGED
#   (report banner offering re-assessment), never silently used or silently blocked.
# --------------------------------------------------------------------------
compliance:
  validity_months: 12

# --------------------------------------------------------------------------
# Risk Game inside the category (docs/RISK_GAME_BLEND.md). PROVISIONAL.
#   weight: the game's share of the blended tolerance level (1/3: two thirds questionnaire, one third game). 0 = the game is
#           ignored everywhere. Must be between 0 and 0.5 (the game never outweighs the questionnaire).
#   may_raise: false = the game can only LOWER the tolerance part.
#   class = lowest of (capacity level, blended tolerance level); the no-loss gate still forces C1.
# --------------------------------------------------------------------------
game:
  weight: 0.3333333333
  may_raise: true
