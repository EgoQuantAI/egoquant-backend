[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egoquant-backend"
version = "0.3.0"
description = "EgoQuant wealth-advisory engine: risk questionnaire, three agents, Risk Engine and client report"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "feedparser>=6.0"]
# Market briefing: RSS parsing and the OpenAI SDK (summaries only).
briefing = ["feedparser>=6.0", "openai>=1.40"]
# FinBERT tone scoring, local and free. Large (torch); kept out of the core install and requirements.txt.
nlp = ["transformers>=4.40", "torch>=2.2"]

[project.scripts]
egoquant = "egoquant.cli:main"

[tool.setuptools.packages.find]
include = ["egoquant*"]

[tool.setuptools.package-data]
"egoquant.risk_profile" = ["questions.json", "config.yaml"]
"egoquant.briefing" = ["config.yaml", "data/*.json", "prompts/*.txt"]
"egoquant.preferences" = ["questions.json"]
"egoquant.advisor" = ["config.yaml"]
"egoquant" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
